name: dsh_whale
description: "DSH · 鲸与鱼 —— Flutter 壳 + WebView 承载的界面原型"
publish_to: 'none'

version: 0.1.3+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.1
  http: ^1.6.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  webview_flutter_android: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/web/assets/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon_src.png"
  adaptive_icon_background: "#E8F1FD"
  adaptive_icon_foreground: "assets/icon_src.png"
  min_sdk_android: 21
